<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloud Kitchen — Ops Dashboard</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1420; --panel:#182234; --line:#26324a; --txt:#e6ecf5; --muted:#8ea0bd; --accent:#4da3ff; --pass:#38d39f; --fail:#ff5c72; --warn:#ffb454; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .badge { padding:3px 10px; border-radius:999px; font-size:12px; background:#1f2c44; border:1px solid var(--line); }
  .badge.fw { background:#123; color:var(--accent); border-color:var(--accent); }
  .controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  select,button { background:#1f2c44; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font-size:13px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#062; border-color:var(--accent); color:#032; font-weight:600; }
  main { display:grid; grid-template-columns: 2fr 1fr; gap:14px; padding:16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 10px; }
  .kanban { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .col h3 { font-size:12px; color:var(--muted); margin:0 0 6px; }
  .card { background:#1f2c44; border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:12px; }
  .card .oid { color:var(--accent); font-weight:600; }
  .gauges { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .gauge { background:#1f2c44; border-radius:8px; padding:10px; }
  .bar { height:8px; background:#26324a; border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar > div { height:100%; background:var(--accent); }
  .feed { max-height:230px; overflow:auto; font-size:12px; }
  .verdict { display:flex; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:6px; margin-bottom:5px; background:#1f2c44; }
  .pill { padding:1px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .pill.PASS { background:rgba(56,211,159,.15); color:var(--pass); }
  .pill.FAIL { background:rgba(255,92,114,.15); color:var(--fail); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { padding:5px 6px; text-align:center; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; color:var(--muted); }
  .mx-pass { color:var(--pass); font-weight:700; } .mx-fail { color:var(--fail); font-weight:700; }
  .sub { font-size:11px; color:var(--muted); }
  .full { grid-column:1 / -1; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const STATUSES = ["received","prepping","ready","picked_up"];
const STATUS_LABEL = {received:"Received",prepping:"Prepping",ready:"Ready",picked_up:"Picked up"};

function useChart(ref, cfgFn, dep) {
  useEffect(() => {
    if (!ref.current) return;
    const chart = new Chart(ref.current, cfgFn());
    return () => chart.destroy();
  }, [dep]);
}

function App() {
  const [framework, setFramework] = useState("langgraph");
  const [strategy, setStrategy] = useState("matched");
  const [orders, setOrders] = useState({});     // id -> {id,name,status}
  const [kitchen, setKitchen] = useState({});   // station -> count
  const [couriers, setCouriers] = useState({idle:0,dispatched:0,arrived:0});
  const [metrics, setMetrics] = useState(null);
  const [matrix, setMatrix] = useState(null);
  const [running, setRunning] = useState(false);
  const wsRef = useRef(null);

  const loadStatic = () => {
    fetch("/api/metrics").then(r=>r.json()).then(setMetrics).catch(()=>{});
    fetch("/api/security_matrix").then(r=>r.json()).then(setMatrix).catch(()=>{});
  };
  useEffect(loadStatic, []);

  const start = () => {
    if (wsRef.current) wsRef.current.close();
    setOrders({}); setKitchen({}); setCouriers({idle:0,dispatched:0,arrived:0}); setRunning(true);
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws?strategy=${strategy}&framework=${framework}`);
    wsRef.current = ws;
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      const p = msg.payload || {};
      setOrders(prev => {
        const next = {...prev};
        const setStatus = (id, status, extra={}) => { next[id] = {...(next[id]||{id}), status, ...extra}; };
        if (msg.type === "OrderReceived") { const o=p.order; setStatus(o.id,"received",{name:o.name}); }
        if (msg.type === "OrderPrepping") setStatus(p.order_id,"prepping");
        if (msg.type === "OrderReady") { const o=p.order; setStatus(o.id,"ready",{name:o.name}); }
        if (msg.type === "OrderPickedUp") setStatus(p.order_id,"picked_up");
        return next;
      });
      if (msg.type === "OrderPrepping") setKitchen(k=>({...k,[p.station]:(k[p.station]||0)+1}));
      if (msg.type === "OrderReady") setKitchen(k=>({...k,[p.station]:Math.max(0,(k[p.station]||0)-1)}));
      if (msg.type === "CourierDispatched") setCouriers(c=>({...c,dispatched:c.dispatched+1}));
      if (msg.type === "CourierArrived") setCouriers(c=>({...c,dispatched:Math.max(0,c.dispatched-1),arrived:c.arrived+1}));
      if (msg.type === "RunComplete") setRunning(false);
    };
    ws.onclose = () => setRunning(false);
  };

  const byStatus = (s) => Object.values(orders).filter(o=>o.status===s);
  const chartRef = useRef(null);
  useChart(chartRef, () => ({
    type:"bar",
    data:{ labels:["Matched","FIFO","Agentic"],
      datasets:[
        {label:"Food wait (ms)", backgroundColor:"#4da3ff",
          data:[metrics?.matched.avg_food_wait_ms, metrics?.fifo.avg_food_wait_ms, metrics?.agentic.avg_food_wait_ms]},
        {label:"Courier wait (ms)", backgroundColor:"#38d39f",
          data:[metrics?.matched.avg_courier_wait_ms, metrics?.fifo.avg_courier_wait_ms, metrics?.agentic.avg_courier_wait_ms]},
      ]},
    options:{ responsive:true, plugins:{legend:{labels:{color:"#e6ecf5"}}},
      scales:{x:{ticks:{color:"#8ea0bd"}}, y:{ticks:{color:"#8ea0bd"}}}}
  }), metrics);

  const maxCap = 3;
  return (
    <div>
      <header>
        <h1>🍳 Cloud Kitchen — Ops Dashboard</h1>
        <span className="badge fw">Framework: {framework}</span>
        <span className="badge">Strategy: {strategy}</span>
        <span className="badge">{running ? "● live" : "idle"}</span>
        <div className="controls">
          <select value={framework} onChange={e=>setFramework(e.target.value)}>
            {["langgraph","crewai","autogen","agent_sdk","strands"].map(f=><option key={f}>{f}</option>)}
          </select>
          <select value={strategy} onChange={e=>setStrategy(e.target.value)}>
            {["matched","fifo"].map(s=><option key={s}>{s}</option>)}
          </select>
          <button className="primary" onClick={start}>▶ Run</button>
          <button onClick={loadStatic}>↻ Reload metrics</button>
        </div>
      </header>
      <main>
        <div className="panel">
          <h2>Live Order Board</h2>
          <div className="kanban">
            {STATUSES.map(s=>(
              <div className="col" key={s}>
                <h3>{STATUS_LABEL[s]} ({byStatus(s).length})</h3>
                {byStatus(s).map(o=>(
                  <div className="card" key={o.id}><span className="oid">{o.id}</span> {o.name||""}</div>
                ))}
              </div>
            ))}
          </div>
        </div>

        <div className="panel">
          <h2>Kitchen & Courier State</h2>
          <div className="gauges">
            {["grill","fry","salad"].map(st=>(
              <div className="gauge" key={st}>
                <div>{st} <span className="sub">{kitchen[st]||0}/{maxCap}</span></div>
                <div className="bar"><div style={{width:`${Math.min(100,(kitchen[st]||0)/maxCap*100)}%`}}></div></div>
              </div>
            ))}
            <div className="gauge">
              <div>couriers</div>
              <div className="sub">dispatched {couriers.dispatched} · arrived {couriers.arrived}</div>
            </div>
          </div>
        </div>

        <div className="panel">
          <h2>Dispatch Comparison — Matched vs FIFO vs Agentic</h2>
          <canvas ref={chartRef} height="150"></canvas>
        </div>

        <div className="panel">
          <h2>Security Alert Feed (ASI containment)</h2>
          <div className="feed">
            {!matrix && <div className="sub">Loading matrix…</div>}
            {matrix && Object.entries(matrix.matrix[framework]||{}).map(([code,c])=>(
              <div className="verdict" key={code}>
                <span>{code} <span className="sub">{c.defense}</span></span>
                <span className={"pill "+(c.passed?"PASS":"FAIL")}>{c.passed?"PASS":"FAIL"}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="panel full">
          <h2>Framework × ASI Security Matrix</h2>
          {matrix && (
            <table>
              <thead><tr><th>framework</th>{matrix.scenarios.map(s=><th key={s}>{s}</th>)}<th>score</th></tr></thead>
              <tbody>
                {Object.entries(matrix.matrix).map(([fw,cells])=>(
                  <tr key={fw}>
                    <td>{fw}</td>
                    {matrix.scenarios.map(s=>(
                      <td key={s} className={cells[s]?.passed?"mx-pass":"mx-fail"}>{cells[s]?.passed?"PASS":"FAIL"}</td>
                    ))}
                    <td>{matrix.summary[fw].passed}/{matrix.summary[fw].total}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          <div className="sub" style={{marginTop:8}}>
            Defense column: <b>framework</b> = contained by the framework's own guardrail;
            <b> rest_gate</b> = contained only by the REST/MCP scope+approval gate (fragile);
            <b> none</b> = not contained → FAIL.
          </div>
        </div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
